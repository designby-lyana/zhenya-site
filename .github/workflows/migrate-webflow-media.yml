name: Перенести фото з Webflow

# Запускається вручну один раз: Actions → «Перенести фото з Webflow» → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/download-webflow-media.mjs
      - name: Зберегти фото в репозиторій
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media
          git diff --cached --quiet || git commit -m "Фото перенесено з Webflow"
          git push
